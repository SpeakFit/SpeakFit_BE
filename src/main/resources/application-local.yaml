spring:
  config:
    activate:
      on-profile: local

  datasource:
    # DB_HOST / DB_PORT / DB_NAME / DB_USERNAME / DB_PASSWORD 로 지정하고, 없으면 로컬 MySQL 기본값을 사용한다.
    # LOCAL_DB_* 는 이전 이름이며 호환을 위해서만 남겨 두었다. (추후 제거 예정)
    url: ${LOCAL_DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:speakfit}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:${LOCAL_DB_USERNAME:root}}
    password: ${DB_PASSWORD:${LOCAL_DB_PASSWORD:password}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
