spring:
  config:
    activate:
      on-profile: local

  datasource:
    # 환경변수가 없을 경우 콜론(:) 뒤의 기본값(127.0.0.1 및 root)을 바라보도록 안전장치 세팅
    url: ${LOCAL_DB_URL:jdbc:mysql://127.0.0.1:3306/speakfit?serverTimezone=Asia/Seoul&useLegacyDatetimeCode=false&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${LOCAL_DB_USERNAME:root}
    password: ${LOCAL_DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

jwt:
  secret: ${JWT_SECRET}
  access-token-exp-seconds: ${JWT_ACCESS_EXP_SECONDS:3600}
  refresh-token-exp-seconds: ${JWT_REFRESH_EXP_SECONDS:1209600}