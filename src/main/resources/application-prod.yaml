# 운영 설정. 값이 없으면 기동 시점에 실패하도록 필수 항목에는 기본값을 두지 않는다.
# (환경변수가 빠졌을 때 조용히 로컬 주소로 동작하는 것을 막기 위함)
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false

# nginx(리버스 프록시) 뒤에서 X-Forwarded-* 헤더를 신뢰해 HTTPS 요청으로 인식한다. (Secure 쿠키, 리다이렉트)
server:
  forward-headers-strategy: framework

# 운영에서는 API 문서를 노출하지 않는다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
  cookie:
    secure: true
  ai:
    base-url: ${AI_BASE_URL}
  websocket:
    base-url: ${WS_BASE_URL}
