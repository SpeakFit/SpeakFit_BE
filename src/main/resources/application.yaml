# 공통 설정. 프로파일(local / prod)별 차이는 application-{profile}.yaml 에서만 정의한다.
# 사용하는 환경변수 목록과 예시는 .env.spring.example 참고.
spring:
  application:
    name: speakfit-backend

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      # 스키마는 Flyway(db/migration)가 관리한다. Hibernate 는 엔티티-스키마 일치 여부만 검증한다.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  jackson:
    time-zone: Asia/Seoul
    json:
      read:
        allow-unescaped-control-chars: true

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

logging:
  level:
    root: info

# 헬스체크: /actuator/health (DB 연결 상태 포함). 그 외 actuator 엔드포인트는 노출하지 않는다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

cloud:
  aws:
    credentials:
      # 로컬 개발에서만 지정한다. 비워 두면 EC2 의 IAM 역할 등 기본 자격 증명 체인을 사용한다.
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
      use-default-aws-credentials-chain: true
    region:
      static: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${AWS_S3_BUCKET}
    stack:
      auto: false

app:
  s3:
    # 비공개 버킷의 파일을 브라우저에 보여 줄 때 쓰는 서명 URL 유효 시간(초)
    presign-expire-seconds: ${S3_PRESIGN_EXPIRE_SECONDS:3600}
  cors:
    # 기본값은 로컬 개발용. 운영은 application-prod.yaml 에서 반드시 환경변수로 지정한다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
  cookie:
    secure: false
  ai:
    base-url: ${AI_BASE_URL:http://localhost:5000}
    response-timeout-seconds: ${AI_RESPONSE_TIMEOUT_SECONDS:900}
  websocket:
    base-url: ${WS_BASE_URL:ws://localhost:5000/ws/practice}
  voice:
    min-file-size-bytes: ${VOICE_MIN_FILE_SIZE_BYTES:5120}

jwt:
  # 최소 32바이트(256bit) 이상이어야 한다. Python 분석 서버와 같은 값을 사용한다.
  secret: ${JWT_SECRET}
  access-token-exp-seconds: ${JWT_ACCESS_EXP_SECONDS:3600}
  refresh-token-exp-seconds: ${JWT_REFRESH_EXP_SECONDS:1209600}
