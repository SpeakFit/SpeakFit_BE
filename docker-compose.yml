services:
  backend:
    build: .
    container_name: speakfit-backend
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    restart: always
