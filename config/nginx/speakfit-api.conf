# 파이썬 분석 서버(별도 EC2)의 사설 IP 로 바꾼다. 같은 서버에서 돌리면 127.0.0.1:5000 으로 둔다.
# 이 서버의 보안 그룹은 Spring 서버의 보안 그룹에서 오는 5000 포트만 허용해야 한다.
upstream speakfit_analysis {
    server PYTHON_PRIVATE_IP:5000;
    keepalive 16;
}

server {
    listen 80;
    server_name api.speakfit.org;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.speakfit.org;
    client_max_body_size 200M;

    ssl_certificate /etc/letsencrypt/live/api.speakfit.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.speakfit.org/privkey.pem;

    # 실시간 연습 WebSocket → 파이썬 분석 서버
    location /ws/ {
        proxy_pass http://speakfit_analysis/ws/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 연습 한 번은 길어질 수 있으므로 유휴 연결을 오래 유지한다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 음성 조각을 지연 없이 바로 전달
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
